[package]
name = "skillranker"
version = "0.1.1"
edition = "2024"
rust-version = "1.95"
description = "Session-specific skill advice powered by TypeSafe.ai Jev"
license-file = "LICENSE"
repository = "https://github.com/Dicklesworthstone/skillranker"
publish = false

[[bin]]
name = "sr"
path = "src/main.rs"

# sr-win-sys holds the only unsafe code (audited Win32 security and volume
# reads, sr-winpar.2); skillranker itself keeps forbidding unsafe code. Plain
# cargo commands at the root cover both packages.
[workspace]
members = [".", "crates/sr-win-sys"]
default-members = [".", "crates/sr-win-sys"]

[features]
default = []
# Reserved boundary; no TUI implementation or terminal dependency ships yet.
tui = []

[dependencies]
asupersync = { version = "=0.5.0", default-features = false, features = ["runtime-core", "native-runtime", "tls-native-roots"] }
blake3 = "1.8"
clap = { version = "4", default-features = false, features = ["std"] }
directories = "=6.0.0"
httpdate = "=1.0.3"
frankensearch-core = { git = "https://github.com/Dicklesworthstone/frankensearch.git", rev = "39047c44c3a92ceb71d25c602913b8b2888e2fe7", default-features = false }
frankensearch-quill = { git = "https://github.com/Dicklesworthstone/frankensearch.git", rev = "39047c44c3a92ceb71d25c602913b8b2888e2fe7", default-features = false }
nix = { version = "0.31", default-features = false, features = ["dir", "fs", "poll", "process", "signal", "user"] }
regex = "1.13.1"
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled", "hooks", "limits"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["float_roundtrip"] }
time = { version = "=0.3.55", default-features = false, features = ["parsing"] }
toml = { version = "1", default-features = false, features = ["parse", "serde"] }

# Safe access to volume serial numbers and file indexes (file identity) on
# Windows. Already in the Windows graph through frankensearch's same-file.
[target.'cfg(windows)'.dependencies]
winapi-util = "=0.1.11"
# The OS CSPRNG, without unsafe code in this crate. Windows has no /dev/urandom.
# Already in the Windows graph through ahash.
getrandom = "=0.3.4"
# Audited Win32 security-descriptor, volume and creation calls: the only
# package allowed unsafe code (sr-winpar.2, docs/windows-private-storage.md).
sr-win-sys = { path = "crates/sr-win-sys" }

[build-dependencies]
blake3 = "1.8"

# Quill's Cx and our Cx must come from exactly the same package source.
[patch.crates-io]
asupersync = { git = "https://github.com/Dicklesworthstone/asupersync", rev = "81fb7b579ce5f161622f1524391f5202a641cc2e" }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
