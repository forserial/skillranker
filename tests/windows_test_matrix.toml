# tests/windows_test_matrix.toml
#
# Every test gate that runs on Linux but not on native Windows, why, and which
# issue will lift it (sr-winpar.16). tests/windows_test_matrix.rs scans src/ and
# tests/ for such gates and fails if one is missing here or an entry is stale.
#
# A gate is a `#![cfg(...)]` file attribute, or a `#[cfg(...)]` on a test
# function or on a module that contains tests, whose predicate holds on Linux
# and fails on Windows. `item` is "*" for a whole file, `mod NAME` for a module,
# or the test function name. Gates nested inside an already gated scope are
# listed too, so lifting the outer gate cannot silently expose them.
#
# reason:
#   private-storage  needs the owner-only cache, ledger, allowance or export store
#   subprocess       needs the owned-subprocess boundary (cass, Git, children)
#   hook-suite       the Claude hook contract suites
#   provider-stub    drives the loopback TLS provider stub through /usr/bin/python3
#   unix-fixture     builds Unix symlinks, FIFOs, devices, pipes, directory
#                    streams or non-UTF-8 byte names
#   unaudited        no Windows-specific dependency found; gated by its authors
#   linux-only       a Linux mechanism (tmpfs, /proc, pidfd, statfs, raw bytes)
#   unix-only        a POSIX mechanism (signals, rlimits)
#   platform-twin    the Linux/macOS half of a test whose Windows half exists
#
# issue: the sr-winpar child whose completion lifts the gate, or
# "permanent: <reason>". `also` names further blockers.
#
# Reconciliation (the commit that added this file, native Windows 11 MSVC vs
# WSL2 Linux, `cargo test --locked -- --list`): Windows lists 975 tests, Linux 1,824;
# all 877 Linux-only tests (175 lib unit tests, 702 integration tests in 98
# binaries) fall under these gates, and every gate excludes at least one test.
# The one test Windows ignores is ignored on every platform. Windows-only
# suites: tests/authorized_read_windows.rs, tests/windows_platform.rs and
# capabilities_contract's Windows twin.

